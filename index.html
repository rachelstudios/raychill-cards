<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raychill Pick a Card</title>
<style>
  body {
    font-family: 'Roboto Mono', monospace;
    background-color: #ffdbe4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px;
    margin: 0;
  }

  h2 {
    font-size: 18px;
    margin-bottom: 20px;
    text-align: center;
  }

  .cards-container {
    display: flex;
    justify-content: center;
    gap: 10px; /* smaller spacing around cards */
    flex-wrap: wrap;
    overflow: visible; /* allow selected card to expand */
    margin-top: 20px;
  }

  .card {
    width: 120px;
    height: 160px;
    background-color: #ffe6eb; /* light pink card background */
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    perspective: 1000px;
    transition: transform 0.3s, opacity 0.3s;
    transform-origin: center bottom; /* scaling grows upwards evenly */
  }

  .card.selected {
    transform: scale(1.5);
    z-index: 10;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    box-sizing: border-box;
  }

  .card-front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 10px;
  }

  .card-back {
    transform: rotateY(180deg);
  }

  .card-back img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 10px;
  }

  .pick-text {
    font-size: 16px;
    margin-bottom: 10px;
    transition: opacity 0.5s;
  }

  @media (max-width: 480px) {
    .card {
      width: 90px;
      height: 120px;
    }
    .card.selected {
      transform: scale(1.3);
    }
  }

  .fade-in {
    animation: fadeIn 0.5s ease-in;
  }

  @keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
  }
</style>
</head>
<body>

<h2 class="pick-text">Pick a card:</h2>

<div class="cards-container">
  <div class="card fade-in">
    <div class="card-inner">
      <div class="card-front"><img src="https://i.imgur.com/ohMnVZa.png" alt="Card Back"></div>
      <div class="card-back"><img src="" alt="Affirmation"></div>
    </div>
  </div>
  <div class="card fade-in">
    <div class="card-inner">
      <div class="card-front"><img src="https://i.imgur.com/ohMnVZa.png" alt="Card Back"></div>
      <div class="card-back"><img src="" alt="Affirmation"></div>
    </div>
  </div>
  <div class="card fade-in">
    <div class="card-inner">
      <div class="card-front"><img src="https://i.imgur.com/ohMnVZa.png" alt="Card Back"></div>
      <div class="card-back"><img src="" alt="Affirmation"></div>
    </div>
  </div>
</div>

<script>
const affirmationImages = [
  "https://i.imgur.com/nkTeerG.png",
  "https://i.imgur.com/EjHXDbL.png",
  "https://i.imgur.com/nc4STAC.png",
  "https://i.imgur.com/a6Z5N1U.png",
  "https://i.imgur.com/IZJtLDF.png"
];

const cards = document.querySelectorAll('.card');
const pickText = document.querySelector('.pick-text');

function getRandomAffirmation() {
  return affirmationImages[Math.floor(Math.random() * affirmationImages.length)];
}

cards.forEach(card => {
  card.addEventListener('click', () => {
    const isFlipped = card.classList.contains('flipped');

    if(isFlipped) {
      // Reset all cards
      cards.forEach(c => {
        c.classList.remove('flipped', 'selected');
        c.style.opacity = 1;
        c.querySelector('.card-back img').src = "";
      });
      pickText.style.opacity = 1;
    } else {
      // Assign a random affirmation to clicked card
      const affirmationURL = getRandomAffirmation();
      card.querySelector('.card-back img').src = affirmationURL;

      // Hide other cards
      cards.forEach(c => {
        if(c !== card) c.style.opacity = 0;
      });

      // Enlarge selected card
      card.classList.add('selected', 'flipped');
      pickText.style.opacity = 0;
    }
  });
});
</script>

</body>
</html>
