<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raychill Pick a Card</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Roboto Mono', monospace;
    background-color: #ffdbe4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px;
  }
  h2 {
    font-size: 18px;
    margin-bottom: 20px;
    transition: opacity 0.5s ease;
  }
  .cards-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    opacity: 0;
    animation: fadeIn 1.2s ease forwards;
  }
  .card {
    width: 120px;
    height: 160px;
    background-color: #ffe6eb;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    perspective: 1000px;
    transition: transform 0.5s ease, opacity 0.5s ease;
    overflow: hidden;
  }
  .card img {
    width: 90%;
    height: auto;
    object-fit: contain;
  }
  .card.selected {
    transform: scale(1.5);
    z-index: 10;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }
  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }
  .card-front {
    background-color: #ffe6eb;
  }
  .card-back {
    background-color: #ffe6eb;
    transform: rotateY(180deg);
    padding: 8px;
  }
  .card-back img {
    width: 100%;
    height: auto;
    border-radius: 8px;
  }
  @media (max-width: 480px) {
    .card {
      width: 90px;
      height: 120px;
    }
    .card.selected {
      transform: scale(1.3);
    }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<h2 id="title">Pick a card:</h2>
<div class="cards-container">
  <div class="card">
    <div class="card-inner">
      <div class="card-front"><img src="https://i.imgur.com/ohMnVZa.png" alt="Card"></div>
      <div class="card-back"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-inner">
      <div class="card-front"><img src="https://i.imgur.com/ohMnVZa.png" alt="Card"></div>
      <div class="card-back"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-inner">
      <div class="card-front"><img src="https://i.imgur.com/ohMnVZa.png" alt="Card"></div>
      <div class="card-back"></div>
    </div>
  </div>
</div>

<script>
// Your affirmation PNGs on Imgur
const affirmationImages = [
  "https://i.imgur.com/nkTeerG.png",
  "https://i.imgur.com/EjHXDbL.png",
  "https://i.imgur.com/nc4STAC.png",
  "https://i.imgur.com/a6Z5N1U.png",
  "https://i.imgur.com/IZJtLDF.png"
];

const cards = document.querySelectorAll('.card');
const title = document.getElementById('title');

cards.forEach(card => {
  card.addEventListener('click', () => {
    const isFlipped = card.classList.contains('flipped');

    if (isFlipped) {
      // Reset everything
      cards.forEach(c => {
        c.classList.remove('flipped', 'selected');
        c.style.opacity = 1;
      });
      title.style.opacity = 1;
    } else {
      // Pick a random affirmation image
      const randomImg = affirmationImages[Math.floor(Math.random() * affirmationImages.length)];
      card.querySelector('.card-back').innerHTML = `<img src="${randomImg}" alt="Affirmation">`;

      // Hide other cards, enlarge this one
      cards.forEach(c => {
        if (c !== card) {
          c.style.opacity = 0;
        }
      });
      card.classList.add('selected', 'flipped');
      title.style.opacity = 0; // Hide "Pick a card" text
    }
  });
});
</script>
</body>
</html>
