<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raychill Pick a Card</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Roboto Mono', monospace;
    background-color: #ffdbe4;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: flex-start;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 60px; /* pushed down more */
    padding-bottom: 40px;
    width: 100%;
    box-sizing: border-box;
  }

  h2 {
    font-size: 20px; /* a little bigger */
    margin-bottom: 15px;
  }

  .cards-container {
    display: flex;
    justify-content: center;
    gap: 8px; /* slightly less space between cards */
    flex-wrap: wrap;
  }

  .card {
    width: 160px; /* bigger cards */
    height: 200px;
    background-color: #ffe6eb;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    perspective: 1000px;
    transition: transform 0.3s, opacity 0.3s;
    padding: 4px; /* thin, even padding around the card */
    box-sizing: border-box;
  }

  .card.selected {
    transform: scale(1.7) translateY(10px); /* knocked down a bit */
    z-index: 10;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 4px; /* thin, even padding */
  }

  .card-front {
    background-color: #ffe6eb;
  }

  .card-front img {
    width: 100%;
    height: auto;
    border-radius: 10px;
  }

  .card-back {
    background-color: #ffe6eb;
    transform: rotateY(180deg);
  }

  .card-back img {
    width: 100%;
    height: auto;
    border-radius: 10px;
  }

  @media (max-width: 480px) {
    .card {
      width: 130px;
      height: 160px;
    }
    .card.selected {
      transform: scale(1.5) translateY(8px);
    }
    h2 {
      font-size: 18px;
    }
  }
</style>
</head>
<body>
<div class="container">
  <h2 id="pickText">Pick a card:</h2>
  <div class="cards-container">
    <div class="card">
      <div class="card-inner">
        <div class="card-front">
          <img src="https://i.imgur.com/ohMnVZa.png" alt="Card Back">
        </div>
        <div class="card-back">
          <img src="https://i.imgur.com/nkTeerG.png" alt="Affirmation 1">
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-inner">
        <div class="card-front">
          <img src="https://i.imgur.com/ohMnVZa.png" alt="Card Back">
        </div>
        <div class="card-back">
          <img src="https://i.imgur.com/EjHXDbL.png" alt="Affirmation 2">
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-inner">
        <div class="card-front">
          <img src="https://i.imgur.com/ohMnVZa.png" alt="Card Back">
        </div>
        <div class="card-back">
          <img src="https://i.imgur.com/nc4STAC.png" alt="Affirmation 3">
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const cards = document.querySelectorAll('.card');
const pickText = document.getElementById('pickText');

cards.forEach(card => {
  card.addEventListener('click', () => {
    const isFlipped = card.classList.contains('flipped');

    if (isFlipped) {
      // Reset all cards
      cards.forEach(c => {
        c.classList.remove('flipped', 'selected');
        c.style.opacity = 1;
      });
      pickText.style.display = "block";
    } else {
      // Spotlight this card
      cards.forEach(c => {
        if(c !== card) {
          c.style.opacity = 0;
        }
      });
      card.classList.add('selected', 'flipped');
      pickText.style.display = "none";
    }
  });
});
</script>
</body>
</html>
