<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raychill Pick a Card</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Roboto Mono', monospace;
    background-color: #ffdbe4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px;
  }
  h2 {
    font-size: 18px;
    margin-bottom: 20px;
  }
  .cards-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .card {
    width: 120px;
    height: 160px;
    background-color: #ffe6eb;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    perspective: 1000px;
    transition: transform 0.3s, opacity 0.3s;
  }
  .card.selected {
    transform: scale(1.5);
    z-index: 10;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }
  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px;
    box-sizing: border-box;
  }
  .card-front {
    background-color: #ffe6eb;
  }
  .card-back {
    background-color: #ffe6eb;
    transform: rotateY(180deg);
    font-size: 10pt;
    line-height: 1.2;
  }
  @media (max-width: 480px) {
    .card {
      width: 90px;
      height: 120px;
    }
    .card.selected {
      transform: scale(1.3);
    }
  }
</style>
</head>
<body>
<h2>Pick a card:</h2>
<div class="cards-container">
  <div class="card">
    <div class="card-inner">
      <div class="card-front"><img src="https://i.imgur.com/AAvGn7U.gif" alt="Heart" width="60"></div>
      <div class="card-back"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-inner">
      <div class="card-front"><img src="https://i.imgur.com/s7Vlmvf.gif" alt="Heart" width="60"></div>
      <div class="card-back"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-inner">
      <div class="card-front"><img src="https://i.imgur.com/KgnG3lv.gif" alt="Heart" width="60"></div>
      <div class="card-back"></div>
    </div>
  </div>
</div>

<script>
const affirmations = [
  "Resonate, what is for you will resonate with you",
  "Life is for living!",
  "Breathe in calm, breathe out tension",
  "Surrender to the experience of life",
  "Take a moment for rest today"
];

const cards = document.querySelectorAll('.card');

cards.forEach(card => {
  card.addEventListener('click', () => {
    const isFlipped = card.classList.contains('flipped');

    // Reset all cards if already flipped
    if(isFlipped) {
      cards.forEach(c => {
        c.classList.remove('flipped', 'selected');
        c.style.opacity = 1;
      });
    } else {
      // Pick a random affirmation
      const randomAffirmation = affirmations[Math.floor(Math.random() * affirmations.length)];
      card.querySelector('.card-back').textContent = randomAffirmation;

      // Hide other cards and enlarge this one
      cards.forEach(c => {
        if(c !== card) {
          c.style.opacity = 0;
        }
      });
      card.classList.add('selected', 'flipped');
    }
  });
});
</script>
</body>
</html>
